# Aptly on Render.
#
# One Blueprint, three services: the API, the web app, and a Postgres database.
# Render reads this file and creates all of them, wired to each other — so the
# only thing left to type by hand is the Gemini key.
#
# Two things to know before the first deploy:
#
# **SQLite is not an option here.** Render's disk is wiped on every deploy and
# every restart, so a SQLite file takes the Library with it. The database below
# is the whole reason this file exists.
#
# **The free tier sleeps.** A service with no traffic for fifteen minutes spins
# down, and the next request pays about fifty seconds to wake it. A tailoring
# run already takes over a minute, so on free the first one after a quiet spell
# looks like the app has hung. Fine for showing somebody; not fine for real use.

# No database here. Postgres is Supabase's, which is a separate account and a
# secret this file must not carry — and Render's own free tier deletes itself
# after ninety days, taking the Library with it.

services:
  # ── API ───────────────────────────────────────────────────────────────────
  - type: web
    name: aptly-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    # `uv sync` rather than pip: the lockfile is the one that was tested, and
    # this is the same command that runs locally.
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn aptly.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Supabase's Postgres, not Render's — set by hand, because it lives in a
      # different account. Session pooler (5432) or transaction pooler (6543)
      # both work; the app disables asyncpg's statement cache for the latter,
      # which would otherwise fail under load. The scheme is rewritten to
      # postgresql+asyncpg:// on its own.
      - key: DATABASE_URL
        sync: false

      # Real authentication. Either of these switches the API off the
      # development sign-in — which is email-only, has no password, and refuses
      # to run in production — and on to verifying Supabase's access tokens.
      #
      # Which one a project needs depends on how it signs. Newer projects sign
      # asymmetrically (ES256) and publish the public key at a JWKS endpoint
      # derived from SUPABASE_URL; they have no shared secret at all. Older ones
      # share an HS256 secret. Set whichever the project's JWT Keys page shows,
      # together with APTLY_ENV=production.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Not `production`: that switches on the Supabase auth path, and until
      # SUPABASE_JWT_SECRET is set there is nothing behind it — the app refuses
      # to start the only sign-in it has and every Library request fails.
      #
      # `staging` means deployed but not production: HTTPS cookies and JSON
      # logs, still on the development sign-in. That sign-in is email-only with
      # no password, so this is a demo rather than somewhere to keep real
      # applications. Configure Supabase, then switch this to `production`.
      - key: APTLY_ENV
        value: staging

      # Alembic carries no migrations yet, so a fresh Postgres would get no
      # tables at all. Turn this off as soon as there are migrations — before
      # anybody's real data is in here.
      #
      # After creating tables on Supabase, run
      # `backend/scripts/lock_down_supabase.py` against the same database.
      # Supabase publishes every public table through PostgREST and grants the
      # anon role — whose key ships in the frontend bundle — full access to
      # them. Creating a table there is publishing it.
      - key: APTLY_DB_AUTO_CREATE
        value: "true"

      # The only secret. Render prompts for it on the first deploy and never
      # writes it into this file.
      - key: GEMINI_API_KEY
        sync: false

      # Google's free tier says "data used for training", and the input here is
      # people's CVs. The app refuses to run on a free-tier key while this is on.
      - key: APTLY_REQUIRE_PAID_LLM
        value: "true"

      - key: GEMINI_MODEL_MAIN
        value: gemini-2.5-flash
      - key: GEMINI_MODEL_FAST
        value: gemini-2.5-flash-lite

      # Anonymous visitors run the expensive path before signing up, so this is
      # a real bill with no account attached to it. Three a day per browser, and
      # a hard ceiling on the day's total spend.
      - key: APTLY_ANON_TAILORS_PER_DAY
        value: "3"
      - key: APTLY_DAILY_SPEND_CEILING_USD
        value: "5.00"
      - key: APTLY_MAX_UPLOAD_MB
        value: "5"

      # Which origin the browser is allowed to call this from. Anything else is
      # refused, so this has to name the web service exactly.
      - key: CORS_ORIGINS
        fromService:
          name: aptly-web
          type: web
          property: host

  # ── Web ───────────────────────────────────────────────────────────────────
  - type: web
    name: aptly-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Read at *build* time, not at runtime: Next.js inlines NEXT_PUBLIC_*
      # into the bundle. Change it and the site has to be rebuilt, not
      # restarted — which is why it is here and not typed into the dashboard
      # afterwards.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: aptly-api
          type: web
          property: host

      # The browser's half of Supabase Auth, and it has to be set in the same
      # breath as the API's half.
      #
      # The two halves decide independently whether real authentication is on —
      # the API from SUPABASE_URL / SUPABASE_JWT_SECRET, the browser from these
      # — and a mismatch fails silently in both directions. Set on the API only,
      # the browser shows the development email box and the API answers it with
      # "this deployment uses Supabase Auth", so nobody can sign in at all. Set
      # here only, the browser sends a bearer token the API never looks at, so
      # sign-in appears to work and the Library is empty forever.
      #
      # The anon key is publishable by design — it ends up in the bundle either
      # way, and row-level security is what protects the data. It is `sync:
      # false` because it belongs to a project, not to this blueprint. The JWT
      # *secret* is a real secret and never goes here; it lives on the API.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
